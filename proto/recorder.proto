syntax = "proto3";

package recorder;


option go_package = "github.com/brotherlogic/recorder/proto";

message NewRecordRequest{}

message NewRecordResponse{}

service RecordGetter {
  rpc NewRecord(NewRecordRequest) returns (NewRecordResponse);
}

message GetQualityRequest {
  int64 release_id = 1;
}

message GetQualityResponse {
  int32 score = 1;
}

service QualityService {
  rpc GetQuality(GetQualityRequest) returns (GetQualityResponse);
}
